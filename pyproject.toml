[project]
name = "ta-phishing-pajak-unsia"
version = "0.1.0"
description = "Tugas Akhir Prototype PJJ Informatika UNSIA: Komparasi SVM dan Random Forest dalam Deteksi Pesan Phishing WhatsApp Mengatasnamakan Otoritas Perpajakan"
readme = "data/README_DATASET.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.2",
    "reportlab>=4.2.0",
    "Sastrawi>=1.0.1",
    "scikit-learn>=1.5.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "streamlit>=1.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]
