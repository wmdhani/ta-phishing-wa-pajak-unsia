<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <title>Cek Pesan Pajak</title>
  <style>
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      width: 340px;
      padding: 14px;
      margin: 0;
      background: #eaeef2;
      color: #121821;
    }
    .head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }
    h1 {
      font-size: 14.5px;
      font-weight: 800;
      margin: 0;
      color: #0a4a69;
    }
    .status {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      background: #e1e7ee;
      color: #435061;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      height: 88px;
      padding: 9px 10px;
      font-family: inherit;
      font-size: 12.5px;
      line-height: 1.45;
      border: 1.5px solid rgba(18, 24, 33, 0.16);
      border-radius: 10px;
      background: #f4f7fa;
      color: #121821;
      resize: vertical;
    }
    :where(a, button, textarea):focus-visible {
      outline: 2px solid #0a4a69;
      outline-offset: 2px;
    }
    textarea:focus {
      border-color: #0a4a69;
      background: #ffffff;
    }
    button {
      margin-top: 8px;
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      background: #0a4a69;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    button:hover {
      background: #073850;
    }
    #output {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      font-size: 12px;
      line-height: 1.45;
      display: none;
    }
    .foot-link {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      margin-top: 10px;
      font-size: 11.5px;
      font-weight: 700;
      color: #0a4a69;
      text-decoration: none;
      text-underline-offset: 3px;
    }
    .foot-link:hover {
      text-decoration: underline;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="head">
    <h1>Cek Pesan Pajak</h1>
    <span id="api-status" class="status">Cek layanan...</span>
  </div>
  <label for="msg-input" class="sr-only">Teks pesan WhatsApp yang ingin diperiksa</label>
  <textarea id="msg-input" placeholder="Paste chat WA pajak yang mau dicek..."></textarea>
  <button id="check-btn" type="button">Cek Pesan Sekarang</button>
  <div id="output"></div>
  <a class="foot-link" href="http://127.0.0.1:8000/" target="_blank" rel="noopener noreferrer">
    Buka web lengkap &amp; panduan darurat &rarr;
  </a>
  <script src="popup.js"></script>
</body>
</html>
